version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    groups:
      microsoft: { patterns: ["Microsoft.*", "Npgsql*"] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      angular: { patterns: ["@angular/*", "@angular-eslint/*"] }
      nx: { patterns: ["@nx/*", "nx"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
