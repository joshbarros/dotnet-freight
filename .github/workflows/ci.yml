name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: freight_test
          POSTGRES_USER: freight
          POSTGRES_PASSWORD: freight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freight"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FREIGHT_TEST_DB: "Host=localhost;Port=5432;Database=freight_test;Username=freight;Password=freight"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: npm ci
      - run: dotnet restore Freight.sln
      - run: npm run format:check
      - run: dotnet test tests/api/Freight.Api.Tests.csproj --no-restore
      - run: npx nx run-many -t build -p web api
